

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: helm-wukongim
spec:
  serviceName: {{ .Values.serviceName }}
  replicas: {{ int .Values.replicaCount }}
  selector:
    matchLabels:
      app: wukongim
  
  # 添加存储卷声明模板（关键修改点）
  volumeClaimTemplates:
  - metadata:
      name: data  # 卷名称，将在容器中挂载
    spec:
      accessModes: [ "ReadWriteOnce" ]  # 单节点读写模式，确保存储隔离
      storageClassName: {{ .Values.storage.class | default "standard" }}  # 存储类名，通过values.yaml配置
      resources:
        requests:
          storage: {{ .Values.storage.size | default "10Gi" }}  # 每个Pod请求的存储大小

  template:
    metadata:
      labels:
        app: wukongim
    spec:
      containers:
        - name: wukongim
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WK_CLUSTER_SERVERADDR_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_IP
              value: "$(WK_CLUSTER_SERVERADDR_IP)"
            - name: WK_CLUSTER_SERVERADDR
              value: "$(WK_CLUSTER_SERVERADDR_IP):11110"
            - name: WK_EXTERNAL_TCPADDR
              value: "ws://{{ .Values.externalIP }}:5100"
            - name: WK_EXTERNAL_WSADDR
              value: "ws://{{ .Values.externalIP }}:5200"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - /bin/sh
            - -c
            - |
              echo "当前命名空间: ${POD_NAMESPACE}"
              echo "当前节点名称: ${POD_NAME}+1"
              NODE_ID=$(echo "${POD_NAME##*-}")
              NEW_NODE_ID=$((NODE_ID + 1))
              export WK_CLUSTER_NODEID="${NEW_NODE_ID}"
              echo "Node ID: ${WK_CLUSTER_NODEID}"
              export WK_CLUSTER_APIURL="http://${WK_CLUSTER_SERVERADDR_IP}:5001"
              echo "WK_CLUSTER_APIURL: ${WK_CLUSTER_APIURL}"
              echo "WK_EXTERNAL_TCPADDR: ${WK_EXTERNAL_TCPADDR}"
              echo "WK_EXTERNAL_WSADDR: ${WK_EXTERNAL_WSADDR}"

              if [ "$NEW_NODE_ID" -gt 1 ]; then
                  export WK_CLUSTER_SEED="1@helm-wukongim-0.helm-wukongim-headless.${POD_NAMESPACE}.svc.cluster.local:11110"
                  echo "当前种子节点: ${WK_CLUSTER_SEED}"
              else
                  echo "该节点为根节点，无需设置种子节点"
              fi

              exec /home/app --config=/root/wukongim/wk.yaml --ignoreMissingConfig=true
          
          # 添加存储卷挂载（关键修改点）
          volumeMounts:
          - name: data  # 对应volumeClaimTemplates中的名称
            mountPath: /home/wukongimdata  # 容器内挂载路径（根据实际需求修改）
            # subPath: "{{`{{ .Release.Name }}`}}/{{`{{ .Chart.Name }}`}}/$(POD_NAME)"  # 二级隔离路径（可选）

          # 建议添加资源限制（非必须但推荐）
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"

      # 添加存储卷声明
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-helm-wukongim-$(POD_NAME)  # 自动生成唯一PVC名称